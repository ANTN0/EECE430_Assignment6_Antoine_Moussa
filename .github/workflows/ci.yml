name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/antn0/eece430_assignment6_antoine_moussa:latest

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      DJANGO_SECRET_KEY: ci-placeholder
      GEMINI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t $IMAGE .

      - name: Push Docker image
        run: docker push $IMAGE

  deploy:
    needs: test
    runs-on: [self-hosted, ai-agent-deploy]
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Check Docker
        run: docker info

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull $env:IMAGE

      - name: Deploy
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if (docker ps -aq --filter "name=^/ai-agent-app$") { docker rm -f ai-agent-app }
          docker run -d --name ai-agent-app -p 127.0.0.1:8000:8000 -e DJANGO_SECRET_KEY -e GEMINI_API_KEY $env:IMAGE
          exit $LASTEXITCODE
